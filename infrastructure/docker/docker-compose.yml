version: '3.8'

services:
  evenbill-api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: evenbill-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://evenbill_user:evenbill_password@postgres:5432/evenbill
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=insecure-dev-secret-key-change-in-production-1234567890
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=evenbill-receipts
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../../backend/app:/app/app

  postgres:
    image: postgres:16-alpine
    container_name: evenbill-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=evenbill_user
      - POSTGRES_PASSWORD=evenbill_password
      - POSTGRES_DB=evenbill
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evenbill_user -d evenbill"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: evenbill-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: evenbill-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: evenbill-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  postgres_data:
  redis_data:
  minio_data:
