version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=EvenBill
      - SECRET_MANAGER_PROVIDER=${SECRET_MANAGER_PROVIDER:-ENV}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://evenbill_user:${DB_PASSWORD}@postgres:5432/evenbill_prod
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=evenbill-receipts-production
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_REGION=us-east-1
      - CORS_ORIGINS=["https://evenbill.app","https://app.evenbill.com"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - evenbill_network

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: evenbill_prod
      POSTGRES_USER: evenbill_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evenbill_user -d evenbill_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evenbill_network

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evenbill_network

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - evenbill_network

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certs_data:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - evenbill_network

networks:
  evenbill_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  certs_data:
