<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120" fill="none">
  <!-- EvenBill Full Wordmark with Brand Mark -->
  <defs>
    <linearGradient id="wm_top" x1="20" y1="28" x2="90" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#153C32" />
      <stop offset="100%" stop-color="#286B56" />
    </linearGradient>
    <linearGradient id="wm_bottom" x1="30" y1="74" x2="100" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#286B56" />
      <stop offset="100%" stop-color="#153C32" />
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(0, 0)">
    <rect x="22" y="28" width="66" height="20" rx="10" fill="url(#wm_top)" />
    <rect x="32" y="72" width="66" height="20" rx="10" fill="url(#wm_bottom)" />
    <circle cx="60" cy="60" r="14" fill="#9BE5C3" />
    <circle cx="60" cy="60" r="6" fill="#153C32" />
    <circle cx="98" cy="38" r="6" fill="#9BE5C3" />
    <circle cx="22" cy="82" r="6" fill="#9BE5C3" />
  </g>

  <!-- Wordmark Text -->
  <text x="130" y="66" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="800" fill="#153C32" letter-spacing="-1">Even<tspan fill="#286B56">Bill</tspan></text>
  <!-- Tagline -->
  <text x="132" y="90" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500" fill="#286B56" letter-spacing="0.2">Every expense. Everyone accounted for.</text>
</svg>
