name: EvenBill CI / CD Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-quality-and-security:
    name: Backend Test, Lint & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pip-audit flake8

      - name: Lint with Flake8
        working-directory: backend
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Complexity and formatting warning check
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Dependency Vulnerability Audit (pip-audit)
        working-directory: backend
        run: |
          pip-audit --desc on -r requirements.txt || true

      - name: Run Backend Pytest Suite
        working-directory: backend
        run: |
          pytest -v --durations=10

  mobile-quality-and-tests:
    name: Mobile Flutter Test & Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter Test Suite
        working-directory: mobile
        run: flutter test --coverage
